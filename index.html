    // На бесплатном Netlify снизу справа появляется плашка «Powered by Netlify».
    // Не прячем её, а поднимаем меню и кнопку «+», чтобы она их не закрывала.
    (function () {
      const mark = () => document.getElementById("nl-badge-frame") && document.documentElement.classList.add("nl-badge");
      if (mark()) return;
      const mo = new MutationObserver(() => { if (mark()) mo.disconnect(); });
      mo.observe(document.body, { childList: true });
    })();
